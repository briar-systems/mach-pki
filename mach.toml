[project]
id = "pki"
version = "0.3.0"
mach = "^6.8"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# the library, and the only artifact `mach build .` selects
[artifact.pki]
kind = "static"
default = true
entry = "lib/pki.mach"
out = "lib/pki"
targets = ["*"]
link = []
need = []

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.4"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
version = "^0.28"
