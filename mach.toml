[project]
id = "pki"
version = "0.4.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

# the library, and the only artifact `mach build .` selects
[artifact.pki]
kind = "static"
default = true
export = true
entry = "lib/pki.mach"
out = "{project.work}/lib/libpki{artifact.suffix}"
targets = ["*"]
link = []
need = []

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "branch/dev"

[dep.encoding]
git = "https://github.com/briar-systems/mach-encoding"
ref = "branch/dev"
