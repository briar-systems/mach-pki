[project]
id = "interop"
version = "0.0.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.interop]
kind = "bin"
entry = "bin/interop.mach"
out = "{project.work}/bin/interop{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.pki]
path = "../.."

# std and crypto are pinned here because a path dependency carries no pin for
# a dependency it selects by version, and this tree is not committed
[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^10.0.0"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
version = "^0.30.0"
