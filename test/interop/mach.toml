[project]
id = "interop"
version = "0.0.0"
mach = "^6.8"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os = "linux"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.interop]
kind = "bin"
entry = "bin/interop.mach"
out = "bin/interop"
targets = ["*"]
link = []
need = []

[dep.pki]
path = "../.."

# std and crypto are pinned here because a path dependency carries no pin for
# a dependency it selects by version, and this tree is not committed
[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v9.4.1"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "tag/v0.28.0"
